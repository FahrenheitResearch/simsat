name: Agent apply SimSat SHE patch

on:
  push:
    branches: [agent/simsat-she-implementation]

permissions:
  contents: write

concurrency:
  group: agent-she-apply-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-format-and-push:
    if: github.event.head_commit.message == 'chore: activate SimSat SHE patch formatter'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simsat-she-implementation
          fetch-depth: 0
          persist-credentials: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Reconstruct and apply implementation
        shell: bash
        run: |
          set -euo pipefail
          cat .github/agent/simsat-she.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decompress > /tmp/simsat-she.patch
          test "$(sha256sum /tmp/simsat-she.patch | cut -d' ' -f1)" = \
            "ff5231b49e56f003282eb5d02361ebb177ab5d22d61d21ef9bef72b0f812824b"
          git apply --check /tmp/simsat-she.patch
          git apply /tmp/simsat-she.patch
          cargo fmt --all

      - name: Commit formatted implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github/agent
          git config user.name "FahrenheitResearch automation"
          git config user.email "fahrenheitagi@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add positive sky SHE lighting"
          git push origin HEAD:agent/simsat-she-implementation

      - name: Pack formatted source
        shell: bash
        run: tar --exclude=.git -czf /tmp/simsat-she-formatted-source.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: simsat-she-formatted-source
          path: /tmp/simsat-she-formatted-source.tar.gz
          if-no-files-found: error
          retention-days: 1
