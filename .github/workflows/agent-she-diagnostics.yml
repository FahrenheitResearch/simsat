name: Agent SimSat SHE diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/agent-she-diagnostics.yml'
      - '.github/agent-she-diagnostic-trigger.txt'

permissions:
  contents: read

jobs:
  diagnostics:
    if: github.head_ref == 'agent/simsat-she-implementation'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/simsat-she-implementation
          persist-credentials: false

      - name: Install Linux desktop build headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Capture formatting diagnostics
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > /tmp/fmt.log 2>&1
          echo $? > /tmp/fmt.status
          exit 0

      - name: Capture compiler diagnostics
        shell: bash
        run: |
          set +e
          cargo check --workspace --all-targets --locked > /tmp/check.log 2>&1
          echo $? > /tmp/check.status
          exit 0

      - name: Capture clippy diagnostics
        shell: bash
        run: |
          set +e
          cargo clippy --workspace --all-targets --locked -- -D warnings > /tmp/clippy.log 2>&1
          echo $? > /tmp/clippy.status
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: simsat-she-diagnostics
          path: |
            /tmp/fmt.log
            /tmp/fmt.status
            /tmp/check.log
            /tmp/check.status
            /tmp/clippy.log
            /tmp/clippy.status
          if-no-files-found: error
          retention-days: 1
